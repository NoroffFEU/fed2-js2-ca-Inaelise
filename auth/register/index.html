<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <script type="module" src="/src/app.js"></script>
  </head>

  <body class="font-body pt-[55px] bg-white">
    <header
      class="bg-main flex justify-between p-3 fixed w-full top-0 drop-shadow z-20"
    >
      <img
        class="w-[100px] md:w-[120px]"
        src="/images/noroff-logo.png"
        alt="Noroff Logo"
      />
      <nav
        class="fixed top-[55px] left-0 bg-main w-full pt-3 pb-6 px-0 -translate-x-full transition-all duration-500 ease-in-out md:translate-x-0 md:transition-none md:top-0 md:bg-transparent md:py-5"
      >
        <ul
          class="flex flex-col gap-4 items-center font-medium md:flex-row md:justify-end md:gap-8 md:px-4 md:text-sm"
        >
          <li>
            <a id="home-nav" class="hover" title="Go to home" href="/">Home</a>
          </li>
          <li>
            <a
              id="profile-nav"
              class="hover"
              title="Go to profile"
              href="/profile/"
              >My Profile</a
            >
          </li>
          <li>
            <a
              id="create-nav"
              class="hover"
              title="Go to create"
              href="/post/create/"
              >Create</a
            >
          </li>
          <li>
            <a
              id="login-nav"
              class="hover"
              title="Go to log in"
              href="/auth/login/"
              >Log in</a
            >
          </li>
          <li>
            <a id="signup-nav" title="Go to register" href="/auth/register/"
              >Sign up</a
            >
          </li>
          <button class="btn secondary logout-btn" title="Click to log out">
            Log out
          </button>
        </ul>
      </nav>
      <!-- Hamburger menu icon -->
      <div
        class="hamburger hover:cursor-pointer self-center md:hidden"
        title="Click to open/close menu"
      >
        <div class="bar bar-one"></div>
        <div class="bar bar-two"></div>
        <div class="bar bar-three"></div>
      </div>
    </header>
    <main>
      <div class="relative">
        <h1
          class="absolute z-10 top-[190px] left-[35px] text-3xl font-semibold sm:left-[80px] md:left-[120px] md:text-4xl lg:left-[160px] xl:left-[180px] 2xl:left-[240px]"
        >
          Register
        </h1>
        <div
          class="custom-shape-divider-top-1730889672 absolute top-0 left-0 w-full overflow-hidden leading-none rotate-180"
        >
          <svg
            class="relative block [transform:rotateY(180deg)] w-[calc(100%+1.3px)] h-[160px] md:w-[calc(100%+1.3px)] md:h-[186px]"
            data-name="Layer 3"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 1200 120"
            preserveAspectRatio="none"
          >
            <path
              d="M985.66,92.83C906.67,72,823.78,31,743.84,14.19c-82.26-17.34-168.06-16.33-250.45.39-57.84,11.73-114,31.07-172,41.86A600.21,600.21,0,0,1,0,27.35V120H1200V95.8C1132.19,118.92,1055.71,111.31,985.66,92.83Z"
              class="shape-fill fill-main"
            ></path>
          </svg>
        </div>
        <div
          class="custom-shape-divider-top-1730889672 absolute top-[12px] left-0 w-full overflow-hidden leading-none rotate-180"
        >
          <svg
            class="relative block [transform:rotateY(180deg)] w-[calc(100%+1.3px)] h-[170px] md:w-[calc(100%+1.3px)] md:h-[206px]"
            data-name="Layer 4"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 1200 120"
            preserveAspectRatio="none"
          >
            <path
              d="M985.66,92.83C906.67,72,823.78,31,743.84,14.19c-82.26-17.34-168.06-16.33-250.45.39-57.84,11.73-114,31.07-172,41.86A600.21,600.21,0,0,1,0,27.35V120H1200V95.8C1132.19,118.92,1055.71,111.31,985.66,92.83Z"
              class="shape-fill fill-[#ace3d665]"
            ></path>
          </svg>
        </div>
      </div>
      <div class="pt-[170px] md:pt-[250px]">
        <form
          name="register"
          class="flex flex-col gap-6 items-center pt-[100px] pb-[50px]"
        >
          <div class="flex flex-col gap-1">
            <label for="name" class="font-semibold">Name</label>
            <input
              id="name"
              type="text"
              name="name"
              class="input"
              required
              maxlength="20"
              pattern="^[\w]+$"
              title="Please enter a username using only letters and numbers"
            />
          </div>

          <div class="flex flex-col gap-1">
            <label for="email" class="font-semibold">Email</label>
            <input
              id="email"
              type="email"
              name="email"
              class="input"
              required
              pattern="^[\w\-.]+@(stud\.)?noroff\.no$"
              title="Please enter a valid noroff.no or stud.noroff.no address"
            />
          </div>

          <div class="flex flex-col gap-1">
            <label for="password" class="font-semibold">Password</label>
            <input
              type="password"
              name="password"
              id="password"
              class="input"
              required
              minlength="8"
            />
          </div>

          <button class="btn primary" title="Click to sign up">Sign up</button>
          <div class="text-center text-sm">
            <p>Already have an account?</p>
            <a
              class="font-bold text-secondary inline-block duration-300 hover:scale-105 underline xl:no-underline xl:hover:underline"
              title="Go to log in page"
              href="/auth/login/"
              >Log in</a
            >
          </div>
        </form>
      </div>
    </main>

    <footer class="bg-footer">
      <p class="text-sm">Copyright © 2024 My Social Media</p>
    </footer>
  </body>
</html>
