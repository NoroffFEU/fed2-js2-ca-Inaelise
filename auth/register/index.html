<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <script type="module" src="/src/app.js"></script>
  </head>

  <body class="font-body pt-[55px] bg-white">
    <header
      class="bg-main flex justify-between p-3 fixed w-full top-0 drop-shadow z-20"
    >
      <img
        class="w-[100px] md:w-[120px]"
        src="/images/noroff-logo.png"
        alt="Noroff Logo"
      />
      <nav
        class="fixed top-[55px] left-0 bg-main w-full pt-3 pb-6 px-0 -translate-x-full transition-all duration-300 ease-in-out md:translate-x-0 md:transition-none md:top-0 md:bg-transparent md:py-5"
      >
        <ul
          class="flex flex-col gap-4 items-center font-medium md:flex-row md:justify-end md:gap-8 md:px-4 md:text-sm"
        >
          <li>
            <a class="hover" href="/">Home</a>
          </li>
          <li><a class="hover" href="/profile/">My Profile</a></li>
          <li><a class="hover" href="/auth/login/">Log in</a></li>
          <!-- <li><a href="/auth/register/">Register</a></li> -->
          <li><a class="hover" href="/post/create/">Create</a></li>
          <button class="btn btn-secondary logout-btn">Log out</button>
        </ul>
      </nav>
      <!-- Hamburger menu icon -->
      <div class="hamburger hover:cursor-pointer self-center md:hidden">
        <div class="bar bar-one"></div>
        <div class="bar bar-two"></div>
        <div class="bar bar-three"></div>
      </div>
    </header>
    <main>
      <h1>Register</h1>
      <div class="pt-[170px] md:pt-[250px]">
        <form
          name="register"
          class="flex flex-col gap-6 items-center py-[50px]"
        >
          <div class="flex flex-col gap-1">
            <label for="name" class="font-semibold">Name</label>
            <input
              id="name"
              type="text"
              name="name"
              class="input"
              required
              maxlength="20"
              pattern="^[\w]+$"
              title="Please enter a username using only letters and numbers"
            />
          </div>

          <div class="flex flex-col gap-1">
            <label for="email" class="font-semibold">Email</label>
            <input
              id="email"
              type="email"
              name="email"
              class="input"
              required
              pattern="^[\w\-.]+@(stud\.)?noroff\.no$"
              title="Please enter a valid noroff.no or stud.noroff.no address"
            />
          </div>

          <div class="flex flex-col gap-1">
            <label for="password" class="font-semibold">Password</label>
            <input
              type="password"
              name="password"
              id="password"
              class="input"
              required
              minlength="8"
            />
          </div>

          <button class="btn btn-primary">Sign up</button>
          <div class="text-center text-sm">
            <p>Already have an account?</p>
            <a
              class="font-bold text-secondary inline-block duration-300 hover:scale-105 underline xl:no-underline xl:hover:underline"
              href="/auth/login/"
              >Log in</a
            >
          </div>
        </form>
      </div>
    </main>

    <footer
      class="bg-footer w-full aspect-square bg-no-repeat bg-center bg-cover max-h-[300px] flex justify-center items-center"
    >
      <p class="text-sm">Social Media App © 2024</p>
    </footer>
  </body>
</html>
