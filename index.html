<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>

  <body class="font-body pt-[60px] bg-main">
    <header
      class="bg-main flex justify-between p-3 fixed w-full top-0 drop-shadow"
    >
      <img class="w-[120px]" src="/images/noroff-logo.png" alt="Noroff Logo" />
      <nav
        class="fixed top-[60px] left-0 bg-main w-full pt-3 pb-6 px-0 -translate-x-full transition-all duration-300 ease-in-out md:translate-x-0 md:transition-none md:top-0 md:bg-transparent md:py-5"
      >
        <ul
          class="flex flex-col gap-4 items-center font-medium md:flex-row md:justify-end md:gap-8 md:px-4 md:text-sm"
        >
          <li><a href="/">Home</a></li>
          <li><a href="/profile/">My Profile</a></li>
          <li><a href="/auth/login/">Login</a></li>
          <li><a href="/auth/register/">Register</a></li>
          <li><a href="/post/create/">Create</a></li>
          <button class="btn-secondary logout-btn">Log out</button>
        </ul>
      </nav>

      <div class="hamburger hover:cursor-pointer self-center md:hidden">
        <div class="bar-one h-[3px] w-6 bg-black my-1 rounded-full"></div>
        <div class="bar-two h-[3px] w-6 bg-black my-1 rounded-full"></div>
        <div class="bar-three h-[3px] w-6 bg-black my-1 rounded-full"></div>
      </div>
    </header>
    <main>
      <h1>Home</h1>
      <h2>All posts</h2>
      <ul id="post-list"></ul>
      <div id="pagination">
        <button id="prev">Previous</button>
        <button id="next">Next</button>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
