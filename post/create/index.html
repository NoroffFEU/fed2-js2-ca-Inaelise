<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create post</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body class="font-body pt-[55px] bg-white">
    <header
      class="bg-main flex justify-between p-3 fixed w-full top-0 drop-shadow z-20"
    >
      <img
        class="w-[100px] md:w-[120px]"
        src="/images/noroff-logo.png"
        alt="Noroff Logo"
      />
      <nav
        class="fixed top-[55px] left-0 bg-main w-full pt-3 pb-6 px-0 -translate-x-full transition-all duration-500 ease-in-out md:translate-x-0 md:transition-none md:top-0 md:bg-transparent md:py-5"
      >
        <ul
          class="flex flex-col gap-4 items-center font-medium md:flex-row md:justify-end md:gap-8 md:px-4 md:text-sm"
        >
          <li>
            <a class="hover" href="/">Home</a>
          </li>
          <li><a class="hover" href="/profile/">My Profile</a></li>
          <li><a class="hover" href="/auth/login/">Log in</a></li>
          <!-- <li><a href="/auth/register/">Register</a></li> -->
          <li><a class="hover" href="/post/create/">Create</a></li>
          <button class="btn secondary logout-btn">Log out</button>
        </ul>
      </nav>
      <!-- Hamburger menu icon -->
      <div class="hamburger hover:cursor-pointer self-center md:hidden">
        <div class="bar bar-one"></div>
        <div class="bar bar-two"></div>
        <div class="bar bar-three"></div>
      </div>
    </header>

    <main>
      <h1>Create Post</h1>
      <form name="createPost">
        <div>
          <label for="url">Image URL</label>
          <input
            name="url"
            id="url"
            type="url"
            placeholder="https://example.com"
            pattern="https://.*"
            required
          />
        </div>
        <div>
          <label for="title">Title</label>
          <input name="title" id="title" type="text" required />
        </div>
        <div>
          <label for="body">Content</label>
          <textarea name="body" id="body"></textarea>
        </div>
        <div>
          <label for="tags">Tags</label>
          <input type="text" name="tags" id="tags" />
        </div>
        <button>Create Post</button>
      </form>
    </main>

    <footer class="bg-footer">
      <p class="text-sm">Copyright © 2024 My Social Media</p>
    </footer>
  </body>
</html>
